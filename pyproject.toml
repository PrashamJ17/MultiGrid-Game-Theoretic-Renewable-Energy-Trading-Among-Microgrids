[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microgrid-p2p-game-theory"
version = "0.4.0"
description = "Game-theoretic simulation of peer-to-peer renewable energy trading among grid-connected microgrids (research demonstration with synthetic data)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scipy>=1.11,<2",
]

[project.optional-dependencies]
app = ["streamlit>=1.37,<2", "plotly>=5.20,<7", "matplotlib>=3.8,<4"]
dev = ["pytest>=8,<9"]
# Optional independent LP solver for a Phase 2 cross-check; SciPy HiGHS is the primary solver.
cvxpy = ["cvxpy>=1.4"]

[project.scripts]
microgrid = "microgrid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
